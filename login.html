<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Đăng Nhập</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .login-box { border: 1px solid #ccc; padding: 20px; width: 300px; }
        input { margin-bottom: 10px; width: 90%; padding: 5px; }
        button { padding: 5px 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Đăng nhập hệ thống</h2>
        <form id="loginForm">
            <label for="username">Tên đăng nhập:</label><br>
            <input type="text" id="username" name="username" required><br>
            
            <label for="password">Mật khẩu:</label><br>
            <input type="password" id="password" name="password" required><br>
            
            <button type="button" onclick="kiemTraDangNhap()">Đăng nhập</button>
        </form>
    </div>

    <script>
        function kiemTraDangNhap() {
            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;
            
            if(user === "" || pass === "") {
                alert("Vui lòng nhập đầy đủ thông tin!");
            } else {
                alert("Xin chào " + user + ", tính năng đang được hoàn thiện!");
            }
        }
    </script>

</body>
</html>
